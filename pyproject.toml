[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "thermal-airprint"
version = "0.1.0"
description = "Raspberry Pi thermal AirPrint bridge for the DFRobot DFR0503 printer"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "pyserial>=3.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-mock>=3.14",
]

[project.scripts]
thermal-airprint = "thermal_printer.__main__:main"
thermal-agent = "thermal_printer.__main__:agent_main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
